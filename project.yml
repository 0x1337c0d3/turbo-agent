name: TurboAgent
options:
  bundleIdPrefix: com.onereddog
  deploymentTarget:
    macOS: "26.0"
packages:
  LocalPackage:
    path: .
targets:
  TurboAgentMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/TurboAgentApp
    dependencies:
      - package: LocalPackage
        product: TurboAgentCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onereddog.turbofieldfareagent
        PRODUCT_NAME: TurboAgent
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: TurboAgent.entitlements
        ENABLE_HARDENED_RUNTIME: YES
